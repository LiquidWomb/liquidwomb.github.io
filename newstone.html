<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>stone</title>
  <style> 
   body {
      background-color: #121212;
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }

    .gallery {
      display: flex;
      gap: 0;
      align-items: center;
      justify-content: flex-start;
      margin-left: 10%;
    }

    .gallery img {
      width: 45%;
      max-width: 600px;
      display: block;
    }

    @media (max-width: 600px) {
      .gallery {
        flex-direction: column;
        gap: 1.5rem;
      }
      .gallery img {
        width: 95%;
      }
    }
    img { max-width: 100%; display: block; margin: 4rem 0; }
  </style>
</head>
<body>
  <audio controls src="/assets/song.mp3"></audio>
  <div class="gallery">
    <img src="/assets/photos/whiterocks.jpg">
    <img src="/assets/photos/Green Rock.png">
</body>
